# ==============================================================================
# Docker Swarm Stack Specification for Agilix POS Service
# Deploy with:
#   docker stack deploy -c docker-stack.yml aglix
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-aglix_pos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aglix_network
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-aglix_pos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - aglix_network
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: ingress
      - target: 9001
        published: 9001
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M

  pos-service:
    image: ${IMAGE_NAME:-aglix-pos-service:latest}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4500}
      CORS: ${CORS:-*}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-aglix_pos}
      DB_AUTO_CREATE: "false"
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-aglix-pos-super-secret-jwt-key-32-chars-min}
      CONSOLE_API_KEY: ${CONSOLE_API_KEY:-console-webhook-secret-key-12345}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-aglix-pos}
      S3_FORCE_PATH_STYLE: "true"
      SWAGGER: ${SWAGGER:-development}
    networks:
      - aglix_network
    ports:
      - target: 4500
        published: ${PORT:-4500}
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT:-4500}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      mode: replicated
      replicas: ${REPLICAS:-3}
      endpoint_mode: vip
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  aglix_network:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  minio_data:

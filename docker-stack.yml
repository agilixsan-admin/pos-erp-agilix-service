services:
  pos-service:
    image: ${APP_IMAGE}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4501
    networks:
      - agilix_network
    ports:
      - target: 4501
        published: 4501
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4500/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 3
      endpoint_mode: vip
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
        reservations:
          cpus: '0.2'
          memory: 128M

networks:
  agilix_network:
    external: true
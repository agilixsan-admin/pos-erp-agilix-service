services:
  postgres:
    image: postgres:16-alpine
    container_name: aglix-pos-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-aglix_pos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-aglix_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aglix_network

  minio:
    image: minio/minio:latest
    container_name: aglix-pos-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aglix_network

  pos-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aglix-pos-api
    restart: unless-stopped
    ports:
      - "${PORT:-4500}:${PORT:-4500}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4500}
      CORS: ${CORS:-*}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-aglix_pos}
      DB_AUTO_CREATE: "false"
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-aglix-pos-super-secret-jwt-key-32-chars-min}
      CONSOLE_API_KEY: ${CONSOLE_API_KEY:-console-webhook-secret-key-12345}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-aglix-pos}
      S3_FORCE_PATH_STYLE: "true"
      SWAGGER: ${SWAGGER:-development}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT:-4500}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
    networks:
      - aglix_network

networks:
  aglix_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
